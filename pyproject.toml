[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cimemory"
version = "0.1.0"
description = "Continuous-improvement memory plugin for agent evolution, built on the Toyota Production System (kaizen, PDCA/TBP, jidoka, hansei, yokoten)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["kaizen", "toyota-production-system", "pdca", "tbp", "agent-memory", "continuous-improvement", "lean"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Quality Assurance",
    "Intended Audience :: Developers",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["cimemory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
